# card42-emv deployment plan.
#
# One instance per non-comment line:
#
#   <instance-AID-hex>  <applet-class-AID-hex>  [applet-data-hex]
#
# The instance AID is the AID the instance is installed under and selected by;
# the class AID is the applet AID declared in the CAP (see config/ids.mk
# APPLET_AID / DIRECTORY_AID).  The optional applet data overrides the role that
# is otherwise derived from the instance AID (docs/specs/common/architecture.md §1).
#
# Roles are fixed by the instance AID, so the applet data is normally empty:
#   43415244420101 -> PaymentApplet,   contact
#   43415244420102 -> PaymentApplet,   contactless
#   31504159...31  -> DirectoryApplet, PSE   (alias)
#   32504159...31  -> DirectoryApplet, PPSE  (alias)
#
# This is the production instance set.  The simulator/test-only instances
# (43415244420104/06/08) live in deploy/deploy-emv-test.conf and are appended by the
# simulator and card test flows (Makefile DEPLOY_ALL_CONF).

43415244420101                 43415244420101
43415244420102                 43415244420101
