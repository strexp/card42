name: ci

# Build the three CAPs (debug and release/no-debug) and the five host jars on
# every push to the default branch and on pull requests, and upload them as
# three artifacts (card / card-release / host).  Tag builds are handled by
# release.yml instead.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The Java Card Tools, the GlobalPlatform API and the simulator are
      # git-ignored (tools/); only the first two are needed to build.
      - name: Provision Java Card tools and GlobalPlatform API
        run: bash .github/scripts/provision-tools.sh

      - name: Build CAPs (debug + release) and host jars
        run: make release

      - name: Verify export files
        run: make verify

      - name: Unit tests (pure JVM, no simulator)
        run: make test-unit

      - name: Stage deliverables
        run: bash .github/scripts/stage-deliverables.sh

      - name: Upload card artifact (debug CAPs)
        uses: actions/upload-artifact@v7
        with:
          name: card42-card
          path: dist/card/
          if-no-files-found: error

      - name: Upload release card artifact (no-debug CAPs)
        uses: actions/upload-artifact@v7
        with:
          name: card42-card-release
          path: dist/card-release/
          if-no-files-found: error

      - name: Upload host artifact (jars)
        uses: actions/upload-artifact@v7
        with:
          name: card42-host
          path: dist/host/
          if-no-files-found: error
