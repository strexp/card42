name: ci

# Build the three CAPs (release + debug) and the five host jars on every push
# to the default branch and on pull requests, and upload them as three
# artifacts (card / card-debug / host).  Tag builds are handled by release.yml.
#
# `make` builds both CAP variants flat into build/deliverables/: the release CAP
# is the canonical name and the debug CAP carries a -debug suffix.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The Java Card Tools, the GlobalPlatform API and the simulator are
      # git-ignored (tools/); only the first two are needed to build.
      - name: Provision Java Card tools and GlobalPlatform API
        run: bash .github/scripts/provision-tools.sh

      - name: Build CAPs (release + debug) and host jars
        run: make

      - name: Verify export files
        run: make verify

      - name: Unit tests (pure JVM, no simulator)
        run: make test-unit

      - name: Upload card artifact (release CAPs)
        uses: actions/upload-artifact@v7
        with:
          name: card42-card
          path: |
            build/deliverables/card42-common.cap
            build/deliverables/card42-common.exp
            build/deliverables/card42-emv.cap
            build/deliverables/card42-emv.exp
            build/deliverables/card42-emrtd.cap
            build/deliverables/card42-emrtd.exp
          if-no-files-found: error

      - name: Upload debug card artifact (debug CAPs)
        uses: actions/upload-artifact@v7
        with:
          name: card42-card-debug
          path: |
            build/deliverables/*-debug.cap
            build/deliverables/*-debug.exp
          if-no-files-found: error

      - name: Upload host artifact (jars)
        uses: actions/upload-artifact@v7
        with:
          name: card42-host
          path: build/deliverables/*.jar
          if-no-files-found: error
