name: release

# On a version tag, build the CAPs (debug and release/no-debug) and host jars,
# upload them as the same three artifacts as ci.yml (card / card-release /
# host) and additionally attach them to a DRAFT GitHub release.  The release is
# left as a draft so the notes can be reviewed before publishing; ship the
# `-release` CAPs, keep the debug ones for troubleshooting.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision Java Card tools and GlobalPlatform API
        run: bash .github/scripts/provision-tools.sh

      - name: Build CAPs (debug + release) and host jars
        run: make release

      - name: Verify export files
        run: make verify

      - name: Unit tests (pure JVM, no simulator)
        run: make test-unit

      - name: Stage deliverables
        run: bash .github/scripts/stage-deliverables.sh

      - name: Upload card artifact (debug CAPs)
        uses: actions/upload-artifact@v7
        with:
          name: card42-card
          path: dist/card/
          if-no-files-found: error

      - name: Upload release card artifact (no-debug CAPs)
        uses: actions/upload-artifact@v7
        with:
          name: card42-card-release
          path: dist/card-release/
          if-no-files-found: error

      - name: Upload host artifact (jars)
        uses: actions/upload-artifact@v7
        with:
          name: card42-host
          path: dist/host/
          if-no-files-found: error

      # Attach the debug + release CAPs and the jars to a draft release for the
      # pushed tag.  On a re-run of the same tag the assets are replaced instead
      # of failing.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/card/* dist/card-release/* dist/host/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/card/* dist/card-release/* dist/host/*
          fi
